<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="司法書士">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>司法書士 独学ドリル</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--text:#1b2433;--sub:#667085;--line:#e3e7ee;--pri:#1e3a5f;--pri-soft:#e3ecf5;--acc:#2563eb;--ok:#16a34a;--ok-soft:#dcfce7;--ng:#dc2626;--ng-soft:#fee2e2;--warn:#b45309;--warn-soft:#fef3c7;--r:14px}
@media(prefers-color-scheme:dark){:root{--bg:#0e1218;--card:#171d27;--text:#e7ecf3;--sub:#93a0b3;--line:#283242;--pri:#7fb0ff;--pri-soft:#1b2a44;--acc:#7fb0ff;--ok:#4ade80;--ok-soft:#123a22;--ng:#f87171;--ng-soft:#3d1818;--warn:#fbbf24;--warn-soft:#3a2e10}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:20px;margin:0}
#hd{font-size:12px;color:var(--sub)}
main{padding:0 16px 16px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;padding:9px 0 7px;color:var(--sub);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:var(--pri);font-weight:700}
h2{font-size:14px;color:var(--sub);margin:18px 0 8px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.click{cursor:pointer}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.t{font-weight:700;word-break:break-word}
.s{color:var(--sub);font-size:13px;word-break:break-word}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--pri-soft);color:var(--pri);font-weight:700;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.ng{background:var(--ng-soft);color:var(--ng)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.gray{background:var(--line);color:var(--sub)}
.btn{border:0;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700;background:var(--pri);color:#fff;font-family:inherit}
@media(prefers-color-scheme:dark){.btn{color:#0e1218}}
.btn.sec{background:var(--pri-soft);color:var(--pri)}.btn.ghost{background:none;color:var(--sub);border:1px solid var(--line)}.btn.ng{background:var(--ng-soft);color:var(--ng)}.btn.sm{padding:6px 10px;font-size:12px}
.btn.wide{width:100%}.btn:disabled{opacity:.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;margin:8px 0}
.seg button{flex:1;border:0;background:none;padding:7px 0;border-radius:8px;color:var(--sub);font-weight:700;font-size:13px;font-family:inherit}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
input{width:100%;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--acc)}
.prog.ok i{background:var(--ok)}
.big{font-size:34px;font-weight:800;line-height:1.1}
.hero{background:var(--pri);color:#fff;border:0}.hero .s{color:rgba(255,255,255,.85)}
@media(prefers-color-scheme:dark){.hero{color:#0e1218}.hero .s{color:rgba(0,0,0,.7)}}
.stem{font-weight:700;font-size:16px;margin:12px 0}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.ox button{border:0;border-radius:16px;padding:18px 0;font-size:34px;font-weight:800;font-family:inherit}
.ox .o{background:var(--ok-soft);color:var(--ok)}.ox .x{background:var(--ng-soft);color:var(--ng)}
.res{border-radius:12px;padding:10px 14px;margin:8px 0 12px;font-weight:800;font-size:17px}
.res.ok{background:var(--ok-soft);color:var(--ok)}.res.ng{background:var(--ng-soft);color:var(--ng)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:99px;padding:6px 11px;font-size:12px;font-weight:700;font-family:inherit}
.chips button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:none;flex:none;color:#fff;font-size:14px;line-height:22px;padding:0}
.chk.on{background:var(--ok);border-color:var(--ok)}
.wk.cur{border:2px solid var(--acc)}
.wk.done .t{color:var(--sub)}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl table{border-collapse:collapse;font-size:13px;min-width:100%}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{background:var(--pri-soft);color:var(--pri);white-space:nowrap}
.tbl td:first-child{font-weight:700;white-space:nowrap}
.ftab{width:100%;border-collapse:collapse;font-size:13px}.ftab td{padding:6px 0;border-bottom:1px solid var(--line)}.ftab td:last-child{text-align:right;white-space:nowrap}
.hrs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.hrs button{flex:1;min-width:52px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1b2433;color:#fff;padding:8px 16px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
#toast.on{opacity:1}
</style>
</head>

const md = s => { const d = new Date(s + 'T00:00:00'); return `${d.getMonth() + 1}/${d.getDate()}`; };
const today = () => ymd(new Date());
const dayDiff = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
const weekStart = i => { const d = new Date(D.START + 'T00:00:00'); d.setDate(d.getDate() + i * 7); return ymd(d); };
const weekEnd = i => { const d = new Date(D.START + 'T00:00:00'); d.setDate(d.getDate() + i * 7 + 6); return ymd(d); };
const curWeek = () => Math.min(D.weeks.length - 1, Math.max(0, Math.floor(dayDiff(D.START, today()) / 7)));
const SUBJ = uniq(D.quiz.map(q => q[0]));

/* 保存データ：q=問題ごとの記録 / wk=完了した週 / hrs=日付ごとの学習時間 */
const def = () => ({ q: {}, wk: {}, hrs: {} });
let S = (() => { try { const d = JSON.parse(localStorage.getItem(KEY)); return d ? Object.assign(def(), d) : def(); } catch { return def(); } })();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { toast('保存できませんでした'); } }
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 1600); }
const mastered = i => (S.q[i]?.s || 0) >= 2;
const weak = i => !!S.q[i] && (S.q[i].l === 0 || !mastered(i));
const weekHours = i => Object.entries(S.hrs).filter(([d]) => d >= weekStart(i) && d <= weekEnd(i)).reduce((s, [, h]) => s + h, 0);

let tab = 'home', ui = { sf: [], tbl: 0 };
const TABS = [['home', 'ホーム', '🏠'], ['quiz', '○×', '⭕'], ['table', '比較表', '📊'], ['plan', '計画', '🗓'], ['rec', '記録', '📈']];
const TITLE = { home: '司法書士 独学ドリル', quiz: '○×問題', table: '論点整理（比較表）', plan: '週間計画（33週）', rec: '学習記録' };
function render() {
  $('#title').textContent = TITLE[tab];
  $('#nav').innerHTML = TABS.map(([k, n, i]) => `<button class="${k === tab ? 'on' : ''}" data-a="tab" data-v="${k}"><span class="ic">${i}</span>${n}</button>`).join('');
  $('#main').innerHTML = { home: vHome, quiz: vQuiz, table: vTable, plan: vPlan, rec: vRec }[tab]();
  const d = dayDiff(today(), D.EXAM); $('#hd').textContent = d > 0 ? `筆記試験まであと${d}日` : d === 0 ? '本日筆記試験' : '';
}

/* ===== ホーム ===== */
function vHome() {
  const d = dayDiff(today(), D.EXAM), w = curWeek(), W = D.weeks[w], h = weekHours(w), th = S.hrs[today()] || 0;
  const next = D.schedule.filter(([dt]) => dt >= today()).slice(0, 3);
  const before = today() < D.START;
  const mas = D.quiz.filter((_, i) => mastered(i)).length, wk = D.quiz.filter((_, i) => weak(i)).length;
  return `
  <div class="card hero"><div class="s">2027年7月4日（日）筆記試験（予測）</div>
    <div class="big">${d > 0 ? `あと ${d} 日` : d === 0 ? '本日試験日' : '試験終了'}</div>
    <div class="s">午前 9:30〜11:30／午後 13:00〜16:00</div></div>
  <h2>${before ? '最初の週（11/16〜）の目標' : `今週の目標（第${w + 1}週 ${md(weekStart(w))}〜${md(weekEnd(w))}）`}</h2>
  <div class="card click" data-a="tab" data-v="plan"><div class="row" style="flex-wrap:wrap;gap:6px"><span class="badge">${esc(W[0])}</span><span class="badge gray">${esc(W[1])}</span>${S.wk[w] ? '<span class="badge ok">完了</span>' : ''}</div>
    <div class="t" style="margin-top:8px">${esc(W[2])}</div>
    <div class="row s" style="margin-top:6px"><span class="grow">今週の学習時間</span><b>${h} / ${GOAL} 時間</b></div><div class="prog"><i style="width:${Math.min(100, pct(h, GOAL))}%"></i></div></div>
  <h2>今日の学習時間を記録（${md(today())}：${th}時間）</h2>
  <div class="card"><div class="hrs">${[0.5, 1, 2, 3].map(v => `<button class="btn sec sm" data-a="addH" data-v="${v}">＋${v}h</button>`).join('')}<button class="btn ghost sm" data-a="addH" data-v="-0.5">−0.5h</button></div>
    <div class="s" style="margin-top:6px">目安：平日3時間・休日7時間（週${GOAL}時間）</div></div>
  <h2>○×問題（${D.quiz.length}問）</h2>
  <div class="grid2">
    <button class="btn" data-a="qStart" data-v="random10">ランダム10問</button>
    <button class="btn sec" data-a="qWeekly">今週の科目</button>
    <button class="btn sec" data-a="qStart" data-v="weak" ${wk ? '' : 'disabled'}>苦手だけ（${wk}）</button>
    <button class="btn sec" data-a="qStart" data-v="new">未回答だけ</button>
  </div>
  <div class="card" style="margin-top:10px"><div class="row"><div class="grow t">覚えた問題</div><span class="s">${mas}/${D.quiz.length}</span></div><div class="prog ok"><i style="width:${pct(mas, D.quiz.length)}%"></i></div><div class="s" style="margin-top:4px">2回続けて正解すると「覚えた」になります</div></div>
  <h2>今後の予定</h2>
  <div class="card"><table class="ftab">${next.map(([dt, t]) => `<tr><td>${esc(t)}</td><td>${md(dt)}（あと${dayDiff(today(), dt)}日）</td></tr>`).join('')}</table>
    <div class="s" style="margin-top:6px">※日程は予測です。法務省の公式発表で確認してください。</div></div>`;
}

/* ===== ○× ===== */
function vQuiz() {
  if (ui.q) return ui.qi >= ui.q.length ? vQuizEnd() : vQuizQ();
  const pool = D.quiz.map((_, i) => i).filter(i => !ui.sf.length || ui.sf.includes(D.quiz[i][0]));
  const w = pool.filter(weak).length, un = pool.filter(i => !S.q[i]).length;
  return `
  <div class="card"><div class="t">科目を選ぶ（未選択＝全科目）</div>
    <div class="chips">${SUBJ.map(f => `<button class="${ui.sf.includes(f) ? 'on' : ''}" data-a="sf" data-v="${esc(f)}">${esc(f)}</button>`).join('')}</div>
    <div class="s">対象 ${pool.length}問（覚えた ${pool.filter(mastered).length}・苦手 ${w}・未回答 ${un}）</div>
    <div class="grid2" style="margin-top:10px">
      <button class="btn" data-a="qStart" data-v="order">順番に解く</button>
      <button class="btn sec" data-a="qStart" data-v="random">ランダム</button>
      <button class="btn sec" data-a="qStart" data-v="weak" ${w ? '' : 'disabled'}>苦手だけ（${w}）</button>
      <button class="btn sec" data-a="qStart" data-v="new" ${un ? '' : 'disabled'}>未回答だけ（${un}）</button>
    </div></div>
  <h2>科目別の習得状況</h2>
  ${SUBJ.map(f => { const ids = D.quiz.map((_, i) => i).filter(i => D.quiz[i][0] === f), m = ids.filter(mastered).length;
    return `<div class="card click" data-a="qOne" data-v="${esc(f)}"><div class="row"><div class="grow t">${esc(f)}</div><span class="s">${m}/${ids.length}</span></div><div class="prog ok"><i style="width:${pct(m, ids.length)}%"></i></div></div>`; }).join('')}`;
}
function startQuiz(mode, subjects) {
  let p = D.quiz.map((_, i) => i).filter(i => !subjects.length || subjects.includes(D.quiz[i][0]));
  if (mode === 'weak') p = p.filter(weak);
  if (mode === 'new') p = p.filter(i => !S.q[i]);
  if (mode !== 'order') p = shuffle(p);
  if (mode === 'random10') p = p.slice(0, 10);
  if (!p.length) return toast('対象の問題がありません');
  ui.q = p; ui.qi = 0; ui.ans = null; ui.res = []; tab = 'quiz'; render(); scrollTo(0, 0);
}
function vQuizQ() {
  const i = ui.q[ui.qi], [f, k, q, a, exp] = D.quiz[i], r = S.q[i], ans = ui.ans;
  return `
  <div class="row" style="margin:4px 0 8px"><button class="btn ghost sm" data-a="qExit">← 終了</button><div class="grow"></div><span class="badge">${ui.qi + 1} / ${ui.q.length}</span></div>
  <div class="card"><div class="row" style="flex-wrap:wrap;gap:6px"><span class="badge">${esc(f)}</span><span class="badge gray">${esc(k)}</span>${mastered(i) ? '<span class="badge ok">覚えた</span>' : r && r.l === 0 ? '<span class="badge ng">前回×</span>' : ''}</div>
    <div class="stem">${esc(q)}</div>
    ${ans === null ? `<div class="ox"><button class="o" data-a="qAns" data-v="1">○</button><button class="x" data-a="qAns" data-v="0">×</button></div>` : `
    <div class="res ${(ans === 1) === a ? 'ok' : 'ng'}">${(ans === 1) === a ? '⭕ 正解！' : '❌ 不正解'}　答えは「${a ? '○' : '×'}」</div>
    <div class="s"><b>解説</b></div><div>${esc(exp || (a ? '正しい。' : '誤り。'))}</div>`}</div>
  ${ans !== null ? `<button class="btn wide" data-a="qNext">${ui.qi + 1 < ui.q.length ? '次の問題 →' : '結果を見る'}</button>` : ''}`;
}
function vQuizEnd() {
  const ok = ui.res.filter(x => x.ok).length, n = ui.res.length, wr = ui.res.filter(x => !x.ok).map(x => x.i);
  return `
  <div class="card hero"><div class="s">今回の結果</div><div class="big">${ok} / ${n} 問正解</div><div class="s">正答率 ${pct(ok, n)}%</div></div>
  ${wr.length ? `<h2>間違えた問題</h2>${wr.map(i => `<div class="card"><div class="s">${esc(D.quiz[i][0])}｜${esc(D.quiz[i][1])}</div><div class="t">${esc(D.quiz[i][2])}　→ ${D.quiz[i][3] ? '○' : '×'}</div><div class="s">${esc(D.quiz[i][4])}</div></div>`).join('')}` : ''}
  <div class="grid2">${wr.length ? `<button class="btn" data-a="qRetry">間違いを解き直す</button>` : ''}<button class="btn ghost" data-a="qExit">終了</button></div>`;
}

/* ===== 比較表 ===== */
function vTable() {
  return `<div class="chips">${D.tables.map((t, i) => `<button class="${i === ui.tbl ? 'on' : ''}" data-a="tbl" data-v="${i}">${esc(t[0].replace(/（.+）$/, ''))}</button>`).join('')}</div>` +
    D.tables.map(([t, head, rows], i) => i !== ui.tbl ? '' : `<h2>${esc(t)}</h2><div class="card tbl"><table><tr>${head.map(h => `<th>${esc(h)}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`).join('') +
    `<div class="s">表は横にスクロールできます。</div>`;
}

/* ===== 計画 ===== */
function vPlan() {
  const cw = curWeek(), done = Object.keys(S.wk).filter(k => S.wk[k]).length;
  let prev = '';
  return `<div class="card"><div class="row"><div class="grow t">完了した週</div><span class="s">${done}/${D.weeks.length}週</span></div><div class="prog ok"><i style="width:${pct(done, D.weeks.length)}%"></i></div></div>` +
    D.weeks.map((w, i) => { const head = w[0] !== prev ? `<h2>${esc(w[0])}</h2>` : ''; prev = w[0]; const h = weekHours(i);
      return `${head}<div class="card wk ${i === cw && today() >= D.START ? 'cur' : ''} ${S.wk[i] ? 'done' : ''}"><div class="row" style="align-items:flex-start"><div class="grow">
        <div class="s">第${i + 1}週　${md(weekStart(i))}〜${md(weekEnd(i))}　${esc(w[1])}${h ? `　｜ ${h}時間` : ''}</div>
        <div class="t">${esc(w[2])}</div></div><button class="chk ${S.wk[i] ? 'on' : ''}" data-a="wk" data-v="${i}">${S.wk[i] ? '✔' : ''}</button></div></div>`; }).join('');
}

/* ===== 記録 ===== */
function vRec() {
  const total = Object.values(S.hrs).reduce((a, b) => a + b, 0);
  const days = Object.keys(S.hrs).filter(d => S.hrs[d] > 0).sort().reverse().slice(0, 14);
  return `
  <h2>学習時間</h2>
  <div class="card"><div class="row"><div class="grow t">累計</div><b>${total} 時間</b></div><div class="s">目安の合計：${GOAL * D.weeks.length}時間（週${GOAL}時間×${D.weeks.length}週）</div><div class="prog"><i style="width:${Math.min(100, pct(total, GOAL * D.weeks.length))}%"></i></div></div>
  ${days.length ? `<div class="card"><table class="ftab">${days.map(d => `<tr><td>${md(d)}</td><td>${S.hrs[d]}時間</td></tr>`).join('')}</table></div>` : ''}
  <h2>○×問題（科目別）</h2>
  <div class="card"><table class="ftab">${SUBJ.map(f => { const ids = D.quiz.map((_, i) => i).filter(i => D.quiz[i][0] === f), a = ids.filter(i => S.q[i]), c = a.reduce((s, i) => s + S.q[i].c, 0), n = a.reduce((s, i) => s + S.q[i].n, 0);
    return `<tr><td>${esc(f)}</td><td>覚えた${ids.filter(mastered).length}/${ids.length}・正答率${pct(c, n)}%</td></tr>`; }).join('')}</table></div>
  <h2>リセット</h2>
  <div class="grid2"><button class="btn ghost" data-a="reset" data-v="q">○×の記録</button><button class="btn ng" data-a="reset" data-v="all">すべて消去</button></div>
  <div class="s" style="margin-top:12px">記録はこの端末のブラウザ内に保存されます。</div>`;
}

/* ===== 操作 ===== */
const H = {
  tab: v => { tab = v; render(); scrollTo(0, 0); if (v === 'plan') { const el = document.querySelector('.wk.cur'); if (el) el.scrollIntoView({ block: 'center' }); } },
  addH: v => { const t = today(), n = Math.max(0, Math.round(((S.hrs[t] || 0) + +v) * 2) / 2); if (n) S.hrs[t] = n; else delete S.hrs[t]; save(); render(); toast(`今日：${n}時間`); },
  sf: v => { ui.sf = ui.sf.includes(v) ? ui.sf.filter(x => x !== v) : [...ui.sf, v]; render(); },
  qOne: v => startQuiz('order', [v]),
  qStart: v => startQuiz(v, tab === 'quiz' ? ui.sf : []),
  qWeekly: () => { const s = D.weeks[curWeek()][1], m = SUBJ.filter(f => s.split('・').some(x => f.includes(x)) || f.includes(s)); if (!m.length) return toast('今週の科目の問題はありません。ランダムで解きましょう'); startQuiz('random', m); },
  qAns: v => { const i = ui.q[ui.qi], ok = (+v === 1) === D.quiz[i][3], r = S.q[i] || { n: 0, c: 0, s: 0 }; r.n++; if (ok) { r.c++; r.s++; } else r.s = 0; r.l = ok ? 1 : 0; S.q[i] = r; ui.ans = +v; ui.res.push({ i, ok }); save(); render(); },
  qNext: () => { ui.qi++; ui.ans = null; render(); scrollTo(0, 0); },
  qRetry: () => { ui.q = shuffle(ui.res.filter(x => !x.ok).map(x => x.i)); ui.qi = 0; ui.ans = null; ui.res = []; render(); scrollTo(0, 0); },
  qExit: () => { ui.q = null; render(); scrollTo(0, 0); },
  tbl: v => { ui.tbl = +v; render(); },
  wk: v => { S.wk[v] = !S.wk[v]; if (!S.wk[v]) delete S.wk[v]; save(); const y = scrollY; render(); scrollTo(0, y); },
  reset: v => { if (!confirm(v === 'all' ? 'すべての記録（○×・計画・学習時間）を消去します。よろしいですか？' : '○×の記録を消去します。よろしいですか？')) return; if (v === 'all') S = def(); else S.q = {}; save(); render(); toast('消去しました'); },
};
document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (!el) return; const f = H[el.dataset.a]; if (f) f(el.dataset.v); });
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
