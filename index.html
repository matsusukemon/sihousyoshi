<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>買取再販 実践マニュアル</title>
<meta name="theme-color" content="#1f5fbf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="買取再販">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f7f9;--panel:#ffffff;--panel2:#f1f3f6;--line:#dde1e7;--text:#1d2430;--muted:#5d6878;
  --accent:#1f5fbf;--accent-soft:#e6eefb;--ok:#1f8a4c;--ok-soft:#e3f4ea;--warn:#a86400;--warn-soft:#fbf0dc;
  --ng:#c0392b;--ng-soft:#fbe5e2;--star:#d48a00;--shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171c;--panel:#1c2027;--panel2:#242a33;--line:#333b47;--text:#e6e9ee;--muted:#9aa4b2;
    --accent:#6ea2f0;--accent-soft:#1f2c42;--ok:#4cc27e;--ok-soft:#183324;--warn:#e0a33c;--warn-soft:#3a2c14;
    --ng:#ef6b5c;--ng-soft:#3d1d1a;--star:#f0b13c;--shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#14171c;--panel:#1c2027;--panel2:#242a33;--line:#333b47;--text:#e6e9ee;--muted:#9aa4b2;
  --accent:#6ea2f0;--accent-soft:#1f2c42;--ok:#4cc27e;--ok-soft:#183324;--warn:#e0a33c;--warn-soft:#3a2c14;
  --ng:#ef6b5c;--ng-soft:#3d1d1a;--star:#f0b13c;--shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;font-size:14px;line-height:1.65}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap}
header h1{font-size:16px;margin:0;white-space:nowrap}
header .grow{flex:1}
header .case-pick{display:flex;align-items:center;gap:6px;font-size:13px}
header select{max-width:260px}
.layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 54px)}
nav{border-right:1px solid var(--line);background:var(--panel);padding:10px 8px 40px;position:sticky;top:54px;height:calc(100vh - 54px);overflow:auto}
nav .grp{font-size:11px;color:var(--muted);margin:14px 8px 4px;font-weight:600;letter-spacing:.04em}
nav a{display:flex;gap:8px;align-items:baseline;padding:6px 8px;border-radius:6px;text-decoration:none;color:var(--text);font-size:13px}
nav a:hover{background:var(--panel2)}
nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav a .n{color:var(--muted);font-size:11px;min-width:18px;text-align:right}
nav a.on .n{color:var(--accent)}
nav a .st{color:var(--star)}
#navSel{display:none}
main{padding:20px 24px 80px;max-width:1180px;width:100%}
h2{font-size:20px;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 16px}
h3{font-size:15px;margin:20px 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:12px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
label.f>span.hint{font-size:11px}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input[type=number]{text-align:right}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea{width:100%;min-height:70px;resize:vertical}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.unit{position:relative}
.unit input{width:100%;padding-right:38px}
.unit em{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-style:normal;font-size:11px;color:var(--muted);pointer-events:none}
button,.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:6px;padding:6px 12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
button:hover{background:var(--panel2)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.pri:hover{filter:brightness(1.08)}
button.sm{padding:2px 8px;font-size:12px}
button.del{color:var(--ng)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--panel2);white-space:nowrap}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel2)}
tr.cur td{background:var(--accent-soft)}
.tbl-wrap{overflow-x:auto}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-ng{background:var(--ng-soft);color:var(--ng)}
.b-acc{background:var(--accent-soft);color:var(--accent)}
.notice{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin-bottom:14px;font-size:13px}
.notice.warn{border-color:var(--warn);background:var(--warn-soft)}
.phase{border-left:4px solid var(--accent)}
.phase h4{margin:0 0 6px;font-size:14px}
.phase ul{margin:0;padding-left:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);text-decoration:none;color:var(--text);white-space:nowrap}
.chip.star{border-color:var(--star);color:var(--star);font-weight:700}
.arrow{color:var(--muted);font-size:12px}
.flow-row{margin-bottom:10px}
.check-item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.check-item:last-child{border-bottom:0}
.tri{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tri button{border:0;border-radius:0;padding:3px 10px;font-size:12px;background:var(--panel)}
.tri button+button{border-left:1px solid var(--line)}
.tri button.on.ok{background:var(--ok);color:#fff}
.tri button.on.fix{background:var(--warn);color:#fff}
.tri button.on.ng{background:var(--ng);color:#fff}
.check-item input.memo{grid-column:1/-1;font-size:12px;padding:4px 8px}
.timeblock{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.timeblock:last-child{border-bottom:0}
.timeblock .t{font-weight:700;font-variant-numeric:tabular-nums}
.cb{display:flex;gap:8px;align-items:flex-start;padding:2px 0;cursor:pointer}
.cb input{margin-top:4px}
.cb.done span{color:var(--muted);text-decoration:line-through}
.big{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-variant-numeric:tabular-nums}
.kv .k{color:var(--muted)}
.kv .v{text-align:right}
.kv .minus::before{content:"− "}
.kv hr{grid-column:1/-1;border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.result{border:2px solid var(--accent)}
.stack{display:flex;height:22px;border-radius:5px;overflow:hidden;margin:10px 0 6px}
.stack div{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.formula{font-size:13px;background:var(--panel2);border-radius:8px;padding:10px 12px;line-height:2}
.formula b{color:var(--accent)}
.funnel-row{display:grid;grid-template-columns:70px 1fr 120px;gap:10px;align-items:center;margin:8px 0}
.funnel-bar{height:28px;background:var(--panel2);border-radius:6px;overflow:hidden;position:relative}
.funnel-bar div{height:100%;background:var(--accent);opacity:.85}
.funnel-bar span{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:600;color:var(--text)}
.prog{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.prog div{height:100%;background:var(--accent)}
.prog div.done{background:var(--ok)}
.verdict{font-size:28px;font-weight:800;padding:12px 16px;border-radius:10px;text-align:center}
.v-GO{background:var(--ok-soft);color:var(--ok)}
.v-HOLD{background:var(--warn-soft);color:var(--warn)}
.v-NOGO{background:var(--ng-soft);color:var(--ng)}
.v-none{background:var(--panel2);color:var(--muted)}
.principle{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.principle .num{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.doc{background:#fff;color:#111;border:1px solid var(--line);padding:28px 32px;border-radius:6px;font-size:13px}
.doc h3{text-align:center;font-size:20px;margin:0 0 16px;letter-spacing:.3em}
.doc table td,.doc table th{border:1px solid #999;background:#fff;color:#111}
.doc table th{width:28%}
.stamp{display:flex;justify-content:flex-end;gap:0;margin-top:14px}
.stamp div{width:72px;border:1px solid #999;text-align:center;font-size:11px}
.stamp div span{display:block;height:56px;border-top:1px solid #999}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);padding:0;width:min(640px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog form{padding:18px}
dialog h3{margin:0 0 12px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.gloss dt{font-weight:700;margin-top:10px}
.gloss dd{margin:2px 0 0;color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav{display:none}
  #navSel{display:block;width:100%}
  main{padding:14px 16px 80px}
  .grid2,.grid3{grid-template-columns:1fr}
  .grid5{grid-template-columns:repeat(2,1fr)}
  .timeblock{grid-template-columns:1fr;gap:4px}
  header select{max-width:100%}
  header h1{white-space:normal;font-size:14px}
  .doc{padding:16px}
}
@media print{
  header,nav,#navSel,.no-print{display:none!important}
  .layout{display:block}
  main{padding:0;max-width:none}
  body{background:#fff;color:#000}
  .card{box-shadow:none;break-inside:avoid}
}
</style>
</head>
<body>
<header>
  <h1>区分マンション・アパート一室 買取再販 実践マニュアル</h1>
  <div class="grow"></div>
  <div class="case-pick no-print">
    <span class="muted">対象案件</span>
    <select id="caseSel"></select>
    <button class="sm" id="btnNewCase">＋新規案件</button>
  </div>
  <div class="row no-print">
    <button class="sm" id="btnExport" title="全データをJSONで保存">バックアップ</button>
    <button class="sm" id="btnImport" title="JSONから復元">復元</button>
    <input type="file" id="fileImport" accept="application/json" hidden>
  </div>
  <select id="navSel" class="no-print"></select>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ========== データ ========== */
const KEY = 'kaitori-saihan-v1';
const STATUSES = ['情報受領','一次選別通過','現地確認済','詳細査定中','買付提出','決裁承認','契約・決済済','商品化中','販売中','引渡完了','見送り'];
const DROP = STATUSES.length - 1;
const KPI_ITEMS = [
  ['visit','仲介会社訪問数',80],['call','架電数',400],['info','情報提供数',100],
  ['screen','一次選別数',30],['site','現地調査件数',10],['offer','買付提出数',3],['deal','仕入れ成立数',1]
];
const REFORM_ITEMS = [
  ['kitchen','キッチン交換','式',60],['bath','ユニットバス交換','式',90],['toilet','トイレ交換','式',20],
  ['wash','洗面化粧台交換','式',15],['boiler','給湯器交換','式',18],['cloth','クロス張替','㎡',0.12],
  ['floor','フローリング張替','㎡',1.0],['cf','CF・フロアタイル張替','㎡',0.45],['door','建具交換','箇所',5],
  ['fusuma','襖・障子張替','枚',0.6],['tatami','畳表替え','枚',0.6],['light','照明・設備機器交換','式',5],
  ['elec','電気・配管工事','式',10],['clean','ハウスクリーニング','式',5],['junk','残置物撤去','式',10]
];
const SITE_ITEMS = {
  '専有部':['雨漏り・漏水の痕跡（天井・壁のシミ）','水回りの状態（キッチン・浴室・トイレ・洗面）','床の傾き・きしみ','サッシ・建具の建付け','給湯器の年式・動作','残置物の有無・量','臭気・カビ・結露','分電盤・電気容量','バルコニーの状態'],
  '共用部':['エントランスの清掃状況','ゴミ置き場の管理状態','掲示板の荒れ具合（注意喚起の多さ）','エレベーターの保守状況（点検記録）','外壁・廊下のひび割れ・汚れ','駐輪場・駐車場の整理状況','集合ポストの状態（チラシの溢れ）'],
  '周辺環境':['最寄駅からの実歩行時間','嫌悪施設の有無','日当たり・眺望','騒音（道路・線路・近隣）','生活利便施設（スーパー・病院等）']
};
const MGMT_ITEMS = {
  '重要事項調査報告書':['管理費の滞納状況（当該住戸・全体）','修繕積立金の滞納状況','修繕積立金の積立総額・1戸あたりの水準','大規模修繕の履歴','大規模修繕の予定・一時金徴収の有無','修繕積立金の値上げ予定','耐震診断の有無（旧耐震の場合）','管理形態（全部委託／一部委託／自主管理）','アスベスト調査の有無','管理費等の水準（周辺相場比）'],
  '管理規約・使用細則':['ペット飼育の可否','事務所利用の可否','民泊・SOHO利用の制限','楽器演奏の制限','リフォーム工事規定（床材の遮音等級・届出）','専有部の工事可能範囲（配管・サッシ等）','総会議事録の懸案事項']
};
const PROD_STEPS = ['施工業者との打ち合わせ','見積確定・発注','着工','中間確認','完工検査・手直し','ハウスクリーニング','ステージング（家具配置）','販売用写真撮影'];
const SALES_STEPS = ['販売図面の作成','販売価格の確定','ポータルサイト掲載','媒介会社への情報提供','オープンルーム実施','購入申込の受付','条件調整（価格・引渡時期）','売買契約締結','残代金決済・引渡し'];
const NEGO_POINTS = ['残置物の撤去費用','雨漏り・設備不具合の修繕費','長期売出（売れ残り期間）','管理費・修繕積立金の滞納','修繕積立金の値上げ・一時金予定','現金・短期決済（スピードの価値）','契約不適合責任の免責','周辺成約事例との乖離'];

function defaultSim(){
  return {resale:0,reform:0,regFee:15,acqTax:8,buyBroker:true,months:6,mgmtMonthly:2.5,propTaxYear:8,otherHold:2,
    loanPct:90,rate:3.0,sellBroker:true,ad:20,bufferPct:3,profitPct:10,profitMin:150};
}
function defaultState(){
  const t={}; KPI_ITEMS.forEach(([k,,v])=>t[k]=v);
  return {cases:[],channels:[],kpi:{},kpiTargets:t,daily:{},current:'',scratch:{name:'（試算モード）'},unit:{}};
}
function load(){
  try{const r=localStorage.getItem(KEY); if(r) return Object.assign(defaultState(),JSON.parse(r));}catch(e){}
  return defaultState();
}
let S = load();
let saveTimer=null;
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('保存できませんでした（ブラウザの保存領域を確認してください）');}},150); }

function ctx(){ return S.cases.find(c=>c.id===S.current) || S.scratch; }
function hasCase(){ return !!S.cases.find(c=>c.id===S.current); }
function sim(c){ c=c||ctx(); c.sim=Object.assign(defaultSim(),c.sim||{}); return c.sim; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function num(v){ const n=parseFloat(v); return isFinite(n)?n:0; }
function dflt(v,d){ return (v===''||v==null)?d:num(v); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function man(v,d){ if(v==null||!isFinite(v)) return '—'; const p=d==null?1:d; return (Math.round(v*Math.pow(10,p))/Math.pow(10,p)).toLocaleString('ja-JP',{maximumFractionDigits:p})+'万円'; }
function pct(v,d){ if(v==null||!isFinite(v)) return '—'; return (v*100).toFixed(d==null?1:d)+'%'; }
function getP(o,p){ return p.split('.').reduce((a,k)=>a==null?undefined:a[k],o); }
function setP(o,p,v){ const ks=p.split('.'); let a=o; ks.slice(0,-1).forEach(k=>{ if(a[k]==null||typeof a[k]!=='object') a[k]={}; a=a[k]; }); a[ks[ks.length-1]]=v; }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

/* ========== 計算ロジック ========== */
// 仲介手数料（税込・万円）
function brokerFee(p){
  if(p<=0) return 0;
  let f = p<=200 ? p*0.05 : p<=400 ? p*0.04+2 : p*0.03+6;
  return f*1.1;
}
// 買取価格Pで仕入れた場合の各費用
function costsAt(s,P,R){
  R = R==null ? num(s.resale) : R;
  const m=num(s.months);
  const acq = num(s.regFee)+num(s.acqTax)+(s.buyBroker?brokerFee(P):0);
  const interest = P*num(s.loanPct)/100*num(s.rate)/100*m/12;
  const hold = m*num(s.mgmtMonthly)+num(s.propTaxYear)*m/12+num(s.otherHold)+interest;
  const sales = (s.sellBroker?brokerFee(R):0)+num(s.ad);
  const reform = num(s.reform);
  const buffer = R*num(s.bufferPct)/100;
  const target = Math.max(R*num(s.profitPct)/100,num(s.profitMin));
  const invest = P+reform+acq+hold;
  const profit = R-invest-sales;  // 安全余裕を使い切らなかった場合の見込利益
  return {R,P,acq,interest,hold,sales,reform,buffer,target,invest,profit,loan:P*num(s.loanPct)/100};
}
function calcLimit(s){
  const R=num(s.resale);
  if(R<=0) return null;
  let P=R*0.7;
  for(let i=0;i<80;i++){
    const c=costsAt(s,P,R);
    const next=R-c.reform-c.acq-c.hold-c.sales-c.buffer-c.target;
    if(Math.abs(next-P)<1e-6){P=next;break;}
    P=next;
  }
  const c=costsAt(s,Math.max(P,0),R);
  c.limit=P; return c;
}
function calcReform(c){
  c=c||ctx(); const r=c.reform||{}; const q=r.qty||{};
  let sub=0; REFORM_ITEMS.forEach(([k])=>{ sub+=num(q[k])*unitPrice(k); });
  (r.extra||[]).forEach(x=>{ sub+=num(x.qty)*num(x.price); });
  const misc=sub*dflt(r.miscPct,8)/100;
  const cont=(sub+misc)*dflt(r.contPct,5)/100;
  return {sub,misc,cont,total:sub+misc+cont};
}
function unitPrice(k){ const d=REFORM_ITEMS.find(x=>x[0]===k); return dflt(S.unit[k],d[3]); }
function calcComps(c){
  c=c||ctx(); const a=c.appr||{}; const rows=(a.rows||[]).filter(r=>num(r.price)>0&&num(r.area)>0);
  if(!rows.length) return null;
  const units=rows.map(r=>r.price/r.area*(1+num(r.adj)/100));
  const avg=units.reduce((x,y)=>x+y,0)/units.length;
  const adj=['floor','dir','view','plan','age'].reduce((x,k)=>x+num(a[k]),0);
  const area=num(a.area||c.area);
  const base=avg*area*(1+adj/100);
  const safe=base*(1-dflt(a.safePct,5)/100);
  return {n:rows.length,avg,adj,area,base,safe};
}
function siteCount(c){
  const o={ok:0,fix:0,ng:0};
  ['site','mgmt'].forEach(k=>{ const d=(c[k]||{}).st||{}; Object.values(d).forEach(v=>{ if(o[v]!=null) o[v]++; }); });
  return o;
}
function judgeAuto(c){
  const s=sim(c); const r=calcLimit(s); const a={};
  const offer=num((c.offer||{}).price)||num(c.ask);
  if(r && offer>0){
    a.price = offer<=r.limit?'OK':offer<=r.limit*1.15?'HOLD':'NG';
    const p=costsAt(s,offer).profit;
    a.profit = p>=r.target?'OK':p>=r.target*0.5?'HOLD':'NG';
  }
  const sc=siteCount(c);
  if(sc.ok+sc.fix+sc.ng>0) a.mgmt = sc.ng>0?'NG':sc.fix>0?'HOLD':'OK';
  return a;
}
function judgeResult(j){
  j=j||{}; const v=['price','mgmt','loc','profit'].map(k=>j[k]);
  if(v.includes('NG')) return 'NO-GO';
  if(v.some(x=>!x)) return '';
  if(v.includes('HOLD')) return 'HOLD';
  return 'GO';
}
function judgeBadge(r){ return r==='GO'?'<span class="badge b-ok">GO</span>':r==='HOLD'?'<span class="badge b-warn">HOLD</span>':r==='NO-GO'?'<span class="badge b-ng">NO-GO</span>':'<span class="badge">未判定</span>'; }

/* ========== ダイアログフォーム ========== */
function openForm(title,fields,obj,onSave,onDelete){
  const dlg=document.getElementById('dlg'); const f=document.getElementById('dlgForm');
  f.innerHTML=`<h3>${esc(title)}</h3><div class="fields" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr))">${fields.map(([k,l,t,opts])=>{
    const v=getP(obj,k); const val=v==null?'':v;
    if(t==='select') return `<label class="f">${l}<select name="${k}">${opts.map(o=>{const [ov,ol]=Array.isArray(o)?o:[o,o]; return `<option value="${ov}" ${String(ov)===String(val)?'selected':''}>${esc(ol)}</option>`;}).join('')}</select></label>`;
    if(t==='textarea') return `<label class="f" style="grid-column:1/-1">${l}<textarea name="${k}">${esc(val)}</textarea></label>`;
    return `<label class="f">${l}<input name="${k}" type="${t||'text'}" ${t==='number'?'step="any"':''} value="${esc(val)}"></label>`;
  }).join('')}</div><div class="dlg-actions">${onDelete?'<button type="button" class="del" id="dlgDel" style="margin-right:auto">削除</button>':''}<button value="cancel" formnovalidate>キャンセル</button><button class="pri" value="ok">保存</button></div>`;
  if(onDelete) f.querySelector('#dlgDel').onclick=()=>{ if(confirm('削除しますか？')){ onDelete(); save(); dlg.close(); rerender(); } };
  dlg.onclose=()=>{
    if(dlg.returnValue!=='ok') return;
    const o={}; fields.forEach(([k,,t])=>{ const el=f.elements[k]; o[k]= t==='number' ? (el.value===''?'':parseFloat(el.value)) : (k==='status'?+el.value:el.value); });
    onSave(o); save(); rerender();
  };
  dlg.returnValue=''; dlg.showModal();
}
